<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Gestión de Cursos</title>
</head>
<body>
  <script>
    const usuarioGuardado = localStorage.getItem('usuario');
    if (usuarioGuardado) {
      const usuario = JSON.parse(usuarioGuardado);
      const destinos = {
        administrador: 'pages/admin.html',
        docente: 'pages/docente.html',
        estudiante: 'pages/estudiante.html'
      };
      window.location.href = destinos[usuario.rol] || 'pages/login.html';
    } else {
      window.location.href = 'pages/login.html';
    }
  </script>
</body>
</html>
