<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Sistema de Gestión de Cursos</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pagina-login">
  <main class="contenedor-centrado">
    <div class="tarjeta tarjeta-login">
      <div class="marca">
        <span class="marca-punto"></span>
        <h1>Gestión de Cursos</h1>
      </div>
      <p class="subtitulo">Ingresa con tu cuenta institucional</p>

      <form id="form-login" class="formulario">
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" placeholder="nombre@unisabaneta.edu.co" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="boton boton-primario boton-ancho">Iniciar sesión</button>
        <p id="error-login" class="mensaje-error"></p>
      </form>

      <div class="ayuda-credenciales">
        <p>Usuarios de prueba</p>
        <ul>
          <li><strong>Admin:</strong> admin@unisabaneta.edu.co / admin123</li>
          <li><strong>Docente:</strong> docente@unisabaneta.edu.co / docente123</li>
          <li><strong>Estudiante:</strong> estudiante@unisabaneta.edu.co / estudiante123</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
