<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel estudiante · Gestión de Cursos</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="marca">
      <span class="marca-punto"></span>
      <h1>Gestión de Cursos</h1>
    </div>
    <div class="usuario-sesion">
      <p>Bienvenido, <strong id="nombre-usuario"></strong> <span class="etiqueta" id="rol-usuario"></span></p>
      <button id="btn-logout" class="boton boton-secundario">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2>Mis cursos</h2>
      <table class="tabla">
        <thead><tr><th>Curso</th><th>Docente</th></tr></thead>
        <tbody id="tabla-mis-cursos"></tbody>
      </table>
    </section>

    <section class="tarjeta">
      <h2>Mis calificaciones</h2>
      <table class="tabla">
        <thead><tr><th>Curso</th><th>Nota</th><th>Fecha</th></tr></thead>
        <tbody id="tabla-mis-calificaciones"></tbody>
      </table>
    </section>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/estudiante.js"></script>
</body>
</html>
