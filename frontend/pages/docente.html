<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel docente · Gestión de Cursos</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="marca">
      <span class="marca-punto"></span>
      <h1>Gestión de Cursos</h1>
    </div>
    <div class="usuario-sesion">
      <p>Bienvenido, <strong id="nombre-usuario"></strong> <span class="etiqueta" id="rol-usuario"></span></p>
      <button id="btn-logout" class="boton boton-secundario">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2>Mis cursos</h2>
      <ul id="lista-cursos" class="lista-simple"></ul>
    </section>

    <section class="tarjeta">
      <h2>Registrar calificación</h2>
      <form id="form-calificacion" class="formulario formulario-grilla">
        <select id="select-curso-calificacion" required>
          <option value="">Seleccione un curso</option>
        </select>
        <select id="select-estudiante-calificacion" required>
          <option value="">Seleccione un estudiante</option>
        </select>
        <input type="number" id="nota" min="0" max="5" step="0.1" placeholder="Nota (0.0 - 5.0)" required>
        <button type="submit" class="boton boton-primario">Registrar</button>
      </form>
      <p id="mensaje-calificacion" class="mensaje"></p>

      <table class="tabla">
        <thead>
          <tr><th>Estudiante</th><th>Nota</th><th>Fecha</th></tr>
        </thead>
        <tbody id="tabla-calificaciones"></tbody>
      </table>
    </section>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/docente.js"></script>
</body>
</html>
